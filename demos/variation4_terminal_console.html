<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variation 4: High-Contrast Terminal / Field Console</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --green: #4ade80;
      --text: #f8fafc;
      --border: #334155;
      --font: 'JetBrains Mono', monospace, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 24px; font-size: 13px; }
    .console { max-width: 950px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .top-status { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; color: var(--accent); font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; color: #94a3b8; font-size: 11px; margin-bottom: 4px; text-transform: uppercase; }
    .field input { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--green); padding: 10px; font-family: var(--font); font-size: 14px; border-radius: 4px; }
    .field input:focus { border-color: var(--accent); outline: none; }
    .total-banner { background: #0284c7; color: white; padding: 14px; text-align: right; font-size: 16px; font-weight: bold; border-radius: 4px; margin-top: 10px; }
    .btn-exec { width: 100%; margin-top: 20px; background: var(--green); color: #0f172a; padding: 14px; font-weight: bold; text-transform: uppercase; border: none; cursor: pointer; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="console">
    <div class="top-status">
      <span>[SYS_READY] CARGO_RECEIPT_STATION</span>
      <span>DOCKET: #LR-2026-08942</span>
    </div>
    <div class="grid">
      <div>
        <div class="field"><label>&gt; CONSIGNOR_NAME</label><input type="text" value="APEX ELECTRONICS PVT LTD"></div>
        <div class="field"><label>&gt; CONSIGNOR_GSTIN</label><input type="text" value="27AAACA12341ZV"></div>
      </div>
      <div>
        <div class="field"><label>&gt; CONSIGNEE_NAME</label><input type="text" value="NORTHERN RETAILERS LTD"></div>
        <div class="field"><label>&gt; CONSIGNEE_GSTIN</label><input type="text" value="07BBBCA98761ZP"></div>
      </div>
    </div>
    <div class="total-banner">
      TOTAL DUE: ₹ 19,470.00 (INCL. 18% GST)
    </div>
    <button class="btn-exec">&gt; EXECUTE_AND_PRINT_LR_DOCKET</button>
  </div>
</body>
</html>
